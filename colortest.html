.opt.selected{border-color:#ff9f43;background:#fff2e2}

.color-slogan{font-size:18px;font-weight:500;margin-bottom:6px}
.secondary{color:#888;font-size:14px;margin-top:8px}
.score-text{background:#f8f5f0;padding:12px;border-radius:12px;margin-bottom:16px;font-size:14px;line-height:1.6}
.radar-desc{margin:10px 0 12px 0;color:#555;font-size:14px;text-align:center}
.canvas-wrap{width:100%;margin:16px auto;display:block}
canvas{width:100%;display:block}
.desc{line-height:1.7;color:#444;margin-top:12px}
.desc.precise{text-align:left}
.desc.precise h4{margin-top:18px;margin-bottom:8px;color:#444;font-size:16px}
.desc.precise p{margin-bottom:10px}

short:`你习惯照顾身边人的情绪，是圈子里稳定的“缓冲者”。
优势：共情敏锐，很会体谅别人；短板：容易心软，不懂拒绝，持续消耗自己。`,
precise:`<h4>你平时是什么状态</h4>
你很在意氛围和谐，不喜欢冲突。别人难受的时候，你会下意识接住对方情绪，愿意耐心倾听包容。这份善意是本能，不是刻意讨好。
<p><strong>核心短板：边界感偏弱，常常优先别人，委屈自己。</strong></p>

<h4>你的能力分布特点</h4>
共情、感知、内省力比较突出；行动力偏向被动配合；做决定时会习惯性迁就他人。

<h4>压力上来时，你会变成这样</h4>
你很少当场发火。积攒太多委屈后，会悄悄沉默、慢慢疏远对方。很多人察觉不到你的疲惫，还以为你一直都好说话。

<h4>和什么样的人相处舒服</h4>
适合懂得体谅、愿意顾及你感受的伙伴；和目标感极强、只看重结果的人长期相处，很容易持续内耗。

<h4>可以试着这样调整自己</h4>
分清“我愿意体谅”和“我必须承担”。温柔不需要无限供给，练习温和拒绝，不用靠牺牲自己维持关系。`},

"浅杏橙":{vec:[70,45,75,40,60,40],bg:"#ffd7b5",text:"#333",slogan:"乐观亲和",weight:1.0,
short:`擅长带动气氛，社交对你不算负担。喜欢轻松舒服的节奏，本能回避沉重矛盾。
优势：亲和力强，擅长破冰；短板：习惯淡化问题，不爱深挖矛盾。`,
precise:`<h4>你平时是什么状态</h4>
你自带松弛感，很容易和陌生人聊开。你偏爱轻松愉快的氛围，一旦话题变得压抑沉重，会下意识转移话题、开玩笑缓和气氛。
<p><strong>核心短板：害怕沉重冲突，容易拖延棘手问题。</strong></p>

<h4>你的能力分布特点</h4>
共情、行动力不错；感知力中等；审慎度、向内反思的意愿偏低，更看重当下开不开心。

<h4>压力上来时，你会变成这样</h4>
遇到麻烦第一反应不是直面，而是找点乐子散心。如果问题一直悬着，你会假装事情没那么严重。

<h4>和什么样的人相处舒服</h4>
适合轻松随性、不爱揪着细节复盘的朋友；习惯深挖情绪、反复复盘矛盾的人，容易觉得你敷衍。

<h4>可以试着这样调整自己</h4>
轻松是很好的特质，但不是所有矛盾都可以绕开。学着偶尔接住沉重话题，允许关系里存在不愉快。`},

"柠檬黄":{vec:[45,50,85,30,75,45],bg:"#ffe65c",text:"#333",slogan:"明亮活跃",weight:0.75,
short:`好奇心强，喜欢新鲜体验，讨厌一成不变。很愿意带头尝试新东西。
优势：想法多、启动快；短板：耐心不足，容易三分钟热度。`,
precise:`<h4>你平时是什么状态</h4>
单调重复的事情很容易消磨你的热情。你享受开启新项目、尝试新玩法的新鲜感，对未知抱有很高期待。
<p><strong>核心短板：擅长开始，不擅长长期坚持收尾。</strong></p>

<h4>你的能力分布特点</h4>
行动力、感知力是强项；共情、边界中等；审慎度偏低，不喜欢死板固定的规则。

<h4>压力上来时，你会变成这样</h4>
被锁死在枯燥流程里时，很难沉下心，会不断找新兴趣转移注意力，原有计划容易半途而废。

<h4>和什么样的人相处舒服</h4>
适合灵活自由、鼓励试错的环境；和凡事讲究计划、按部就班的人配合，容易被贴上浮躁的标签。

<h4>可以试着这样调整自己</h4>
区分一时兴起的新鲜感，和真正想坚持的目标。给自己设置简单的固定节点，保留探索空间，同时守住重要事情的收尾。`},

"蒂芙尼蓝":{vec:[50,80,50,55,70,60],bg:"#47ccd4",text:"#fff",slogan:"优雅清醒",weight:1.0,
short:`边界感清晰，看人通透冷静。尊重彼此独立，反感别人随意侵入你的私人空间。
优势：情绪稳定、拎得清；短板：容易显得疏离，别人很难走进内心。`,
precise:`<h4>你平时是什么状态</h4>
你心里有清晰的界限：什么属于自己，什么属于别人。你能看懂别人的情绪，但不会随便卷入，反感情绪绑架和过度亲近。
<p><strong>核心短板：习惯保持距离，很少主动敞开心扉。</strong></p>

<h4>你的能力分布特点</h4>
边界感最强，感知、内省力不错；共情中等，不会无底线承接别人情绪。

<h4>压力上来时，你会变成这样</h4>
有人持续越界索取，你不会争吵，而是安静关上表达通道，慢慢拉开距离，属于冷静抽离型。

<h4>和什么样的人相处舒服</h4>
最适合懂得给你独处空间、不强迫交心的人；高共情、时刻需要情绪回应的人，常会觉得你冷淡。

<h4>可以试着这样调整自己</h4>
边界不等于围墙。面对信任的人，可以适度放开一点表达，不必一直维持清醒克制的外壳。`},

"森林绿":{vec:[60,55,40,85,45,50],bg:"#62b872",text:"#fff",slogan:"稳定可靠",weight:0.75,
short:`踏实靠谱，重视承诺，是大家可以托底的角色。偏爱稳定可控的节奏。
优势：责任心强、情绪稳；短板：害怕突发变化，抗拒失控。`,
precise:`<h4>你平时是什么状态</h4>
安全感来自稳定和确定感。答应别人的事会尽量做到，习惯用成熟稳妥的方式做事，不喜欢无准备的冒险。
<p><strong>核心短板：计划被打乱时容易焦虑，不愿变通。</strong></p>

<h4>你的能力分布特点</h4>
审慎度是你的王牌；共情中上；行动力偏保守，不喜欢即兴改动。

<h4>压力上来时，你会变成这样</h4>
突发变动会让你不安，下意识想拉回原来的秩序，有时会固执坚持旧方案，不是固执，是害怕失控。

<h4>和什么样的人相处舒服</h4>
适合节奏稳定、提前沟通变化的伙伴；随性即兴、随时改方向的人，很容易让你持续焦虑。

<h4>可以试着这样调整自己</h4>
接受不是所有事情都能提前安排。可以小范围尝试新方式，不用事事都追求百分百稳妥。`},

"葡萄紫":{vec:[55,65,35,45,80,85],bg:"#856fc9",text:"#fff",slogan:"敏感深刻",weight:0.75,
short:`感知细腻，能捕捉别人忽略的细微情绪。想法丰富，习惯向内思考。
优势：直觉敏锐、共情细腻；短板：容易反复琢磨细节，陷入精神内耗。`,
precise:`<h4>你平时是什么状态</h4>
你的感知很灵敏，一句话、一个表情、氛围的微妙变化都能抓住。你喜欢沉浸在自己的思绪里，嘈杂环境消耗你很快。
<p><strong>核心短板：容易反复回味负面感受，困住自己。</strong></p>

<h4>你的能力分布特点</h4>
感知力、内省力双高；边界感中等；行动力偏弱，更擅长感受思考，而不是快速落地。

<h4>和什么样的人相处舒服</h4>

<h4>可以试着这样调整自己</h4>
分清“我感受到的感受”和“客观事实”。给自己建立信息过滤，不必接住所有细碎情绪。`},

"炭黑":{vec:[35,80,75,60,40,45],bg:"#222222",text:"#fff",slogan:"独立决断",weight:0.75,
short:`目标优先，习惯自己解决问题，不喜欢被情绪裹挟。看重效率和结果。
优势：抗压强、做事果断；短板：不习惯示弱，容易忽略他人感受。`,
precise:`<h4>你平时是什么状态</h4>
做判断优先看目标、可行性，情绪放在次要位置。遇到难题第一想法是自己搞定，反感没有意义的情绪拉扯。
<p><strong>核心短板：习惯硬扛，很难主动求助。</strong></p>

<h4>你的能力分布特点</h4>
边界感、行动力突出，审慎度不错；共情偏低，不太擅长捕捉细腻情绪信号。

<h4>压力上来时，你会变成这样</h4>
压力越大越沉默加速，一个人扛下任务；如果别人用情绪干扰目标推进，会直接推开，容易被误会冷漠。

<h4>和什么样的人相处舒服</h4>
适合高效沟通、以结果为先的合作；很需要情绪安抚的人，常常觉得你不近人情。

<h4>可以试着这样调整自己</h4>
效率和情绪价值并不冲突。适当留意身边人的感受，允许自己求助，独立不必等于硬撑。`},

"玫瑰红":{vec:[60,50,80,40,65,50],bg:"#f04b72",text:"#fff",slogan:"热烈直接",weight:1.0,
short:`爱憎分明，表达直白，在意的人和事会主动争取。讨厌猜来猜去。
优势：真诚果敢、感染力强；短板：情绪来得快，容易冲动说话。`,
precise:`<h4>你平时是什么状态</h4>
你的喜好和不满很少拐弯，不喜欢迂回试探。认定重要的目标，愿意主动投入争取。
<p><strong>核心短板：情绪上头时容易脱口而出，事后后悔。</strong></p>

<h4>你的能力分布特点</h4>
行动力最强，共情、感知中上；审慎度偏低，情绪外放直接。

<h4>压力上来时，你会变成这样</h4>
冲突出现容易立刻表达情绪，先表态、后冷静复盘，属于先爆发，再反思的类型。

<h4>和什么样的人相处舒服</h4>
适合直白沟通、不玩心眼的关系；习惯委婉回避冲突的人，很容易被你的直白刺伤。

<h4>可以试着这样调整自己</h4>
保留真诚直接，给自己加一个短暂停顿。争执时先稳住情绪再开口，减少冲动带来的麻烦。`}
}

let testMode = "fast"
let answers = []
let questions = []

function startTest(mode){
testMode = mode
questions = JSON.parse(JSON.stringify(questionBank[mode]))
answers = Array(questions.length).fill(null)
document.getElementById("page-select").classList.remove("active")
document.getElementById("page-quiz").classList.add("active")
renderQuiz()
}
function renderQuiz(){
const wrap = document.getElementById("q-wrap")
wrap.innerHTML=""
questions.forEach((item,idx)=>{
const div = document.createElement("div")
div.className="q-item"
div.innerHTML=`
<div class="q-title">${idx+1}. ${item.q}</div>
<div class="opt ${answers[idx]==='a'?'selected':''}" onclick="selectOpt(${idx},'a')">A. ${item.a}</div>
<div class="opt ${answers[idx]==='b'?'selected':''}" onclick="selectOpt(${idx},'b')">B. ${item.b}</div>
`
wrap.appendChild(div)
})
document.getElementById("submit-btn").disabled = answers.some(x=>x===null)
}
function selectOpt(i,v){
answers[i]=v
renderQuiz()
}
function calcDimension(){
let dimScore = {"共情力":50,"边界感":50,"行动力":50,"审慎度":50,"感知力":50,"内省力":50}
for(let i=0;i<questions.length;i++){
const q = questions[i]
const sel = answers[i]
const add = sel==='a' ? q.scoreA : q.scoreB
for(let key in add){
dimScore[key] += add[key]
}
}
// 限制分数区间 0~100，防止越界
for(let k in dimScore){
dimScore[k] = Math.max(0, Math.min(100, dimScore[k]))
}
return dimScore
}

// ✅ 加权距离匹配：冷门色乘weight，放大命中范围
function matchColorByDistance(d){
const userVec = radarLabels.map(k=>d[k])
const list = []
for(let name in colorPrototype){
const p = colorPrototype[name].vec
let dist = 0
for(let i=0;i<6;i++){
dist += Math.pow(userVec[i]-p[i],2)
}
dist = Math.sqrt(dist)
// 加权：距离 × weight，weight越小越容易命中
dist = dist * colorPrototype[name].weight
list.push({name,dist})
}
list.sort((a,b)=>a.dist - b.dist)
return {main:list[0].name,sub:list[1].name}
}

// 雷达图（保持原有自适应逻辑不变）
function drawRadar(dimData){
const canvas = document.getElementById("radar-canvas")
const ctx = canvas.getContext("2d")
const w = canvas.width
const h = canvas.height
const cx = w / 2
const cy = h / 2
const r = Math.min(cx, cy) - 36
ctx.clearRect(0,0,w,h)
ctx.strokeStyle="#dddddd"
ctx.fillStyle="#555555"
ctx.font="15px sans-serif"

const dataArr = radarLabels.map(k=>dimData[k])
const currentMax = Math.max(...dataArr) || 1;

for(let ring=1;ring<=4;ring++){
ctx.beginPath()
for(let i=0;i<6;i++){
const ang = Math.PI*2/6*i - Math.PI/2
const rr = r * ring/4
const x = cx + Math.cos(ang)*rr
const y = cy + Math.sin(ang)*rr
i===0 ? ctx.moveTo(x,y):ctx.lineTo(x,y)
}
ctx.closePath()
ctx.stroke()
}
for(let i=0;i<6;i++){
const ang = Math.PI*2/6*i - Math.PI/2
const x = cx + Math.cos(ang)*r
const y = cy + Math.sin(ang)*r
ctx.beginPath()
ctx.moveTo(cx,cy)
ctx.lineTo(x,y)
ctx.stroke()
const labelX = cx + Math.cos(ang)*(r+18)
const labelY = cy + Math.sin(ang)*(r+18)
ctx.fillText(radarLabels[i], labelX, labelY)
}
ctx.beginPath()
ctx.fillStyle="rgba(255,160,70,0.25)"
ctx.strokeStyle="#ff9f43"
ctx.lineWidth=2
for(let i=0;i<6;i++){
const ang = Math.PI*2/6*i - Math.PI/2
const ratio = dataArr[i] / currentMax
const rr = r * ratio
const x = cx + Math.cos(ang)*rr
const y = cy + Math.sin(ang)*rr
i===0 ? ctx.moveTo(x,y):ctx.lineTo(x,y)
}
ctx.closePath()
ctx.fill()
ctx.stroke()
}

function showResult(){
const dimData = calcDimension()
const {main,sub} = matchColorByDistance(dimData)
const meta = colorPrototype[main]
document.getElementById("color-name").innerText = main
document.getElementById("color-name").style.background = meta.bg
document.getElementById("color-name").style.color = meta.text
document.getElementById("color-slogan").innerText = meta.slogan
document.getElementById("sub-color").innerText = sub + "｜" + colorPrototype[sub].slogan
const scoreHtml = radarLabels.map(k=>`${k}：${dimData[k]}分`).join("｜")
document.getElementById("score-box").innerText = scoreHtml
if(testMode === "precise"){
document.getElementById("color-detail").innerHTML = meta.precise
document.getElementById("color-detail").classList.add("precise")
}else{
document.getElementById("color-detail").innerText = meta.short
document.getElementById("color-detail").classList.remove("precise")
}
drawRadar(dimData)
document.getElementById("page-quiz").classList.remove("active")
document.getElementById("page-result").classList.add("active")
}
function restartTest(){
document.getElementById("page-result").classList.remove("active")
document.getElementById("page-select").classList.add("active")
}
document.getElementById("submit-btn").onclick = showResult
